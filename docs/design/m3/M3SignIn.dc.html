<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006493}a:hover{color:#004B6F}
a:focus-visible{outline:3px solid #006493;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F7F9FF; color: #181C20; font-family: Figtree, system-ui, sans-serif; font-size: 15px; line-height: 22px; display: flex; align-items: center; justify-content: center; padding: 24px 16px">
<main style="width: 100%; max-width: 440px; background: #FFFFFF; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column">
<div aria-hidden="true" style="position: relative; height: 180px; background: #D6ECFA; overflow: hidden">
<svg width="100%" height="180" viewBox="0 0 440 180" preserveAspectRatio="xMidYMax slice">
<circle cx="360" cy="52" r="26" fill="#FFD36E"></circle>
<path d="M0 150 C 90 120 170 132 250 142 S 380 128 440 136 V 180 H 0 Z" fill="#B9E0C8"></path>
<rect x="128" y="62" width="184" height="96" rx="8" fill="#FFFFFF"></rect>
<rect x="128" y="62" width="184" height="18" rx="8" fill="#006493"></rect>
<g fill="#CAE6FF"><rect x="146" y="92" width="34" height="24" rx="4"></rect><rect x="203" y="92" width="34" height="24" rx="4"></rect><rect x="260" y="92" width="34" height="24" rx="4"></rect></g>
<rect x="206" y="124" width="28" height="34" rx="4" fill="#71787E"></rect>
<path d="M0 160 H 440 V 180 H 0 Z" fill="#9BCDB0"></path>
</svg>
</div>
<div style="padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #006493">innovin</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.01em">Sign in</h1>
<p style="margin: 0; color: #41474D">Use your @innovinlabs.com Google account.</p>
</div>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; background: #FFDAD6; color: #410002; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 20px">{{ error }}</p></sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}"><a href="#" style="height: 48px; border-radius: 24px; background: #006493; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12V14h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.8 3-4.3 3-7.3ZM12 22c2.7 0 5-.9 6.6-2.5L15.4 17c-.9.6-2 1-3.4 1a6 6 0 0 1-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22ZM6.4 13.9A6 6 0 0 1 6 12c0-.7.1-1.3.4-1.9V7.5H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.5l3.3-2.6ZM12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.9 5.5l3.3 2.6A6 6 0 0 1 12 6Z"></path></svg>Continue with Google</a></sc-if>
<sc-if value="{{ notReady }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; background: #E5E8EE; color: #181C20; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 20px">Sign-in isn't set up on this server yet. Ask an admin.</p></sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ready","wrong-account","busy","not-set-up"],"default":"ready","section":"Demo"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'ready';
    const errors = { 'wrong-account': 'That didn’t work. Use your @innovinlabs.com Google account.', busy: 'Too many tries. Wait a minute and try again.' };
    return { ready: st !== 'not-set-up', notReady: st === 'not-set-up', hasError: !!errors[st], error: errors[st] || '' };
  }
}
</script>
</body>
</html>
